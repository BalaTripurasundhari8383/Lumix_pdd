name: Flutter Android Appium 2.x E2E Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 5. Build Flutter Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: 6. Install Global Appium 2.x & Drivers
        run: |
          mkdir -p ~/.appium
          export APPIUM_HOME=$HOME/.appium
          npm install -g appium@next
          appium driver install --source=npm appium-flutter-driver || true
          appium driver install uiautomator2 || true
          appium -v
          appium driver list

      - name: 7. Install E2E Framework Dependencies
        run: |
          npm install
          cd e2e
          npm install

      - name: 8. Enable KVM Hardware Acceleration Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo chmod 777 /dev/kvm || true

      - name: 9. Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -no-snapshot-save -no-audio -no-boot-anim -camera-back none
          script: |
            export APPIUM_HOME=$HOME/.appium
            echo "Starting Appium Server safely in background..."
            nohup appium --log appium-server.log > /dev/null 2>&1 &
            sleep 8
            
            echo "Verifying connected emulator via ADB..."
            adb devices
            
            echo "Running E2E Test Suite..."
            cd e2e
            npm test || true

      - name: 10. Generate Merged HTML & Excel Reports
        if: always()
        working-directory: e2e
        run: |
          npm run report:merge || true
          npm run report:generate || true

      - name: 11. Upload E2E Test Reports & Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-E2E-Appium-Test-Artifacts
          path: |
            e2e/reports/Flutter_E2E_Report.xlsx
            e2e/reports/index.html
            e2e/reports/failures/
            e2e/reports/execution.log
            appium-server.log
          retention-days: 30
