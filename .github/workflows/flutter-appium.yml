name: Flutter Android Appium 2.x E2E Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: 3. Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 5. Build Flutter Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: 6. Install Global Appium 2.x & Drivers
        run: |
          npm install -g appium@next
          appium driver install --source=npm appium-flutter-driver || true
          appium driver install uiautomator2 || true
          appium -v
          appium driver list

      - name: 7. Install E2E Framework Dependencies
        working-directory: e2e
        run: npm ci || npm install

      - name: 8. Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # Start Appium Server in Background
            appium --log appium-server.log &
            sleep 10
            
            # Verify connected emulator device
            adb devices
            
            # Execute Mocha E2E Test Suite
            cd e2e
            npm test || true

      - name: 9. Generate Merged HTML & Excel Reports
        if: always()
        working-directory: e2e
        run: |
          npm run report:merge || true
          npm run report:generate || true

      - name: 10. Upload E2E Test Reports & Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-E2E-Appium-Test-Artifacts
          path: |
            e2e/reports/Flutter_E2E_Report.xlsx
            e2e/reports/index.html
            e2e/reports/failures/
            e2e/reports/execution.log
            appium-server.log
          retention-days: 30
