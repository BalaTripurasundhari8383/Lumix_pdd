name: Security Review & SAST

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-scan:
    name: Advanced Security Assessment (SAST/DAST/Discovery)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install exceljs fs-extra

      - name: Detect Backend Stack & Run Security Scanner
        run: node src/security/security_scanner.js

      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Semgrep (SAST)
        run: |
          python3 -m pip install semgrep
          semgrep --config auto . --output Vulnerability\ Test\ Results/semgrep-results.json || true

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Security-Assessment-Reports
          path: Vulnerability Test Results/
          retention-days: 30

      - name: Publish Security Summary
        run: |
          echo "### Security Review Completed" >> $GITHUB_STEP_SUMMARY
          cat "Vulnerability Test Results/executive-summary.md" >> $GITHUB_STEP_SUMMARY
